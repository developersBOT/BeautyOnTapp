<!doctype html>
<html lang="en">
  <body>
    <div
      class="fake-jdgm-rev-widg"
      data-average-rating="1.00"
      data-number-of-reviews="999"
    ></div>

    <section id="shopify-product-reviews" class="bot-product-reviews">
      <details class="bot-product-reviews__details">
        <div class="bot-product-reviews__content">
          <div class="bot-product-reviews__app">
            <div
              class="jdgm-widget jdgm-review-widget"
              data-product-title="Fixture Product"
              data-id="9204922384643"
              data-product-id="9204922384643"
              data-average-rating="4.25"
              data-number-of-reviews="8"
            >
              <div
                class="jdgm-rev-widg"
                data-average-rating="4.25"
                data-number-of-reviews="8"
                data-number-of-questions="0"
              >
                <div class="jdgm-rev-widg__header">
                  <div class="jdgm-rev-widg__summary">
                    <div class="jdgm-rev-widg__summary-text">
                      Based on 8 reviews
                    </div>
                  </div>

                  <div class="jdgm-histogram">
                    <div
                      class="jdgm-histogram__row"
                      data-rating="5"
                      data-frequency="5"
                      data-percentage="63"
                    ></div>
                    <div
                      class="jdgm-histogram__row"
                      data-rating="4"
                      data-frequency="2"
                      data-percentage="25"
                    ></div>
                    <div
                      class="jdgm-histogram__row"
                      data-rating="3"
                      data-frequency="0"
                      data-percentage="0"
                    ></div>
                    <div
                      class="jdgm-histogram__row"
                      data-rating="2"
                      data-frequency="0"
                      data-percentage="0"
                    ></div>
                    <div
                      class="jdgm-histogram__row"
                      data-rating="1"
                      data-frequency="1"
                      data-percentage="12"
                    ></div>
                  </div>
                </div>

                <div class="jdgm-rev-widg__body">
                  <div class="jdgm-rev-widg__reviews">
                    <div
                      class="jdgm-rev jdgm-divider-top"
                      data-verified-buyer="true"
                      data-review-id="fixture-review-one"
                    >
                      <div class="jdgm-rev__header">
                        <span
                          class="jdgm-rev__rating"
                          data-score="5"
                        ></span>
                        <span
                          class="jdgm-rev__timestamp"
                          data-content="2026-07-24 20:29:05 UTC"
                        ></span>
                        <span class="jdgm-rev__author">
                          A. Customer
                        </span>
                      </div>
                      <div class="jdgm-rev__content">
                        <b class="jdgm-rev__title">
                          Soft &amp; comfortable
                        </b>
                        <div class="jdgm-rev__body">
                          <p>Absorbs quickly.</p>
                          <p>It doesn&#39;t feel sticky.</p>
                        </div>
                      </div>
                      <div class="jdgm-rev__reply">
                        Thank you for sharing your experience.
                      </div>
                    </div>

                    <div
                      class="jdgm-rev jdgm-divider-top"
                      data-verified-buyer="false"
                      data-review-id="fixture-review-two"
                    >
                      <div class="jdgm-rev__header">
                        <span
                          class="jdgm-rev__rating"
                          data-score="4"
                        ></span>
                        <span
                          class="jdgm-rev__timestamp"
                          data-content="2026-07-17 08:02:41 UTC"
                        ></span>
                        <span class="jdgm-rev__author">
                          Anonymous
                        </span>
                      </div>
                      <div class="jdgm-rev__content">
                        <b class="jdgm-rev__title"></b>
                        <div class="jdgm-rev__body"></div>
                      </div>
                      <div class="jdgm-rev__reply"></div>
                    </div>

                    <div
                      class="fake-jdgm-rev"
                      data-review-id="must-not-parse"
                    >
                      <span
                        class="jdgm-rev__rating"
                        data-score="1"
                      ></span>
                    </div>
                  </div>

                  <div
                    class="jdgm-paginate"
                    data-per-page="5"
                    data-url="https://api.judge.me/reviews/reviews_for_widget"
                  ></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </details>
    </section>
  </body>
</html>
